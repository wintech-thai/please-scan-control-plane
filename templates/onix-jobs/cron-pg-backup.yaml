---
# x088: PostgreSQL-only backup (Please Scan has no app pod to archive, only the
# postgresql-onix-v2 pod to dump) — replaces the old GCS-based version of this
# file, now using the same S3-based app-backup.rb pattern as the SnipeIt/WordPress
# backups (onix-v2-jobs/scripts-ruby/app-backup.rb). No APP_DATA_PATH is set below,
# which puts the script in DB-only mode (skips the app-pod archive step entirely).
# No restore CronJob — not requested for Please Scan.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  # Run on demand for testing: kubectl create job --from=cronjob/pg-backup pg-backup-manual -n please-scan-{{ .Values.envAlias }}
  suspend: {{ .Values.onixJobs.pgBackupSuspend | default false }}
  schedule: "0 2 * * *" # daily 02:00
  timeZone: "Asia/Bangkok"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: please-scan-sa
          restartPolicy: OnFailure
          containers:
          - name: app-backup
            image: "pjamenaja/onix-v2-jobs:{{ .Values.onixJobs.imageTag }}"
            imagePullPolicy: IfNotPresent
            command: ["ruby"]
            args: ["app-backup.rb"]
            env:
            - name: DB_TYPE
              value: "postgresql"
            - name: DB_NAMESPACE
              value: "please-scan-{{ .Values.envAlias }}"
            - name: DB_POD_NAME
              value: "postgresql-onix-v2-0"

            - name: S3_STORAGE_URL
              value: "https://storage.googleapis.com"
            - name: S3_BUCKET
              value: "please-scan-backup"
            - name: S3_BUCKET_PATH
              value: "{{ .Values.envAlias }}"
            - name: FILE_PREFIX
              value: "pg-onix-v2-{{ .Values.envGroup }}"
            - name: S3_TRANSFER_TIMEOUT_SEC
              value: "3600"

            - name: S3_KEY
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secret
                  key: S3_KEY
            - name: S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secret
                  key: S3_SECRET
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secret
                  key: DISCORD_WEBHOOK
