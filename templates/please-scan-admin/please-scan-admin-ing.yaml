{{- if (index .Values "please-scan-admin" "enabled") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: please-scan-admin-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.pleaseScanAdminDomain }}
  rules:
    - host: {{ .Values.pleaseScanAdminDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: please-scan-{{ .Values.envGroup }}-admin
                port:
                  number: 80
{{- end }}
