apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-backup-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: pg-backup-secret      # name of the k8s Secret to be created
    creationPolicy: Owner
  data:
  - secretKey: S3_KEY
    remoteRef:
      key: "initial-secret-preset"
      property: S3_KEY

  - secretKey: S3_SECRET
    remoteRef:
      key: "initial-secret-preset"
      property: S3_SECRET

  - secretKey: DISCORD_WEBHOOK
    remoteRef:
      key: "initial-secret-preset"
      property: DISCORD_WEBHOOK
