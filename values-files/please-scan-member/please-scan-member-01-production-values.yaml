please-scan-member:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      - name: ENV_GROUP
        value: 'prod'

      - name: ENV_RUN
        value: 'Production'

      - name: NODE_ENV
        value: 'Production'

      - name: NEXT_PUBLIC_API_URL
        value: 'https://api.please-scan.com'

      - name: NEXT_PUBLIC_PROVIDER_URL
        value: 'https://dev-hubs.com'
